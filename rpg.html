  #foeName { display:block; font-size:16px; }

  #cmds { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  #modal { position:absolute; inset:0; background:#0b0d14f7; border-radius:10px; display:none; flex-direction:column;

// ---------- 音效(簡單的 WebAudio 嗶聲) ----------
let AC;
function beep(f, d=.09, type="square", v=.035) {
  if (G.mute) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(AC.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d); o.stop(AC.currentTime + d);
  } catch(e) {}
}
const jingle = notes => notes.forEach((f,i) => setTimeout(() => beep(f,.14,"triangle",.05), i*110));

const WEAPONS = [{n:"木劍",v:3,p:30,t:0},{n:"鐵劍",v:6,p:90,t:0},{n:"鋼劍",v:10,p:220,t:2},{n:"秘銀劍",v:13,p:350,t:3},{n:"聖劍",v:16,p:500,t:4},
                 {n:"遠古之劍",v:19,p:650,t:6},{n:"星辰神劍",v:23,p:950,t:7}];
const ARMORS  = [{n:"皮甲",v:2,p:35,t:0},{n:"鎖甲",v:4,p:100,t:1},{n:"鎧甲",v:7,p:240,t:2},{n:"秘銀甲",v:9,p:360,t:3},{n:"龍鱗甲",v:11,p:480,t:4},
                 {n:"神殿聖衣",v:13,p:600,t:6},{n:"星辰戰甲",v:16,p:900,t:7}];

// ---------- 狀態 ----------
const P = { x:2, y:17, cls:null, hp:30, mhp:30, mp:10, mmp:10, atk:6, lv:1, xp:0, next:20, gold:0, potion:2, ether:1,
            def:0, pts:0, weapon:null, armor:null, party:[] };
const G = { area:0, cleared:[], opened:{}, q:{}, comps:{}, shards:0, diff:1, mute:false, ended:false };
const CL = () => CLASSES[P.cls || "war"];
const tAtk = () => P.atk + (P.weapon ? P.weapon.v : 0);
const tDef = () => P.def + (P.armor ? P.armor.v : 0);
const A = () => AREAS[G.area];
const qDone = (ai, n) => ((G.q[ai] && G.q[ai].i) || 0) >= n;
let inBattle = false, foe = null, busy = false;

// ---------- 地圖生成(固定種子,每次相同) ----------
const grids = [];
function build(ai) {
  const a = AREAS[ai];
  let s = ai*977 + 13;
  const r = () => (s = (s*1664525 + 1013904223) >>> 0) / 4294967296;
  const g = [...Array(N)].map(() => Array(N).fill("."));
  for (let i=0;i<N;i++) g[0][i] = g[N-1][i] = g[i][0] = g[i][N-1] = "#";
  const blob = (ch, w, h) => { const x = 1+Math.floor(r()*(N-1-w)), y = 1+Math.floor(r()*(N-1-h));
    for (let dy=0;dy<h;dy++) for (let dx=0;dx<w;dx++) g[y+dy][x+dx] = ch; };
  for (let k=0;k<15;k++) blob("F", 1+Math.floor(r()*3), 1+Math.floor(r()*3));
  for (let k=0;k<3;k++) blob("~", 2+Math.floor(r()*2), 2+Math.floor(r()*3));
  const carve = (p, q) => { let [x,y] = p; const set = () => { if (x>0&&y>0&&x<N-1&&y<N-1) g[y][x] = "."; };
    while (x !== q[0]) { set(); x += Math.sign(q[0]-x); }
    while (y !== q[1]) { set(); y += Math.sign(q[1]-y); }
    set(); };
  const pts = [a.from, a.H, a.S, a.npc.at, ...a.$];
  if (a.comp) pts.push(a.comp.at);
  if (a.star) pts.push(a.star);
  pts.push(a.gate.b);
  for (let i=1;i<pts.length;i++) carve(pts[i-1], pts[i]);
  if (a.pb) carve(a.from, a.pb);
  const { b, p } = a.gate;
  if (p) {
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy]) => {
      const x = p[0]+dx, y = p[1]+dy;
      if ((x !== b[0] || y !== b[1]) && x>=0 && y>=0 && x<N && y<N) g[y][x] = "#";
    });
    g[p[1]][p[0]] = ">";
  }
  g[b[1]][b[0]] = "B";
  g[a.H[1]][a.H[0]] = "H"; g[a.S[1]][a.S[0]] = "S"; g[a.npc.at[1]][a.npc.at[0]] = "N";
  a.$.forEach(([x,y]) => g[y][x] = "$");
  if (a.comp) g[a.comp.at[1]][a.comp.at[0]] = "M";
  if (a.star) g[a.star[1]][a.star[0]] = "*";
  if (a.pb) g[a.pb[1]][a.pb[0]] = "<";
  return g;
}
function gridOf(i) { if (!grids[i]) grids[i] = build(i); return grids[i]; }
const cur = () => gridOf(G.area);
function applyState() {
  G.cleared.forEach((c,i) => { if (c) { const [x,y] = AREAS[i].gate.b; gridOf(i)[y][x] = "."; } });
  Object.keys(G.opened).forEach(k => { const [ai,x,y] = k.split(",").map(Number); gridOf(ai)[y][x] = "."; });
}

// ---------- 存檔 ----------
const SAVE = "rpg_save_v3";
function save() { try { localStorage.setItem(SAVE, JSON.stringify({ P, G })); } catch(e) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem(SAVE)); if (!s || !s.P || !s.P.cls) return false;
    Object.assign(P, s.P); Object.assign(G, s.G); applyState(); return true; } catch(e) { return false; }
}
function newGame() {
  if (!confirm("確定要放棄目前進度,重新開始嗎?")) return;
  try { localStorage.removeItem(SAVE); } catch(e) {}
  location.reload();
}

// ---------- HUD / 繪製 ----------
function hud() {
  const bar = (v,m,c) => `<div class="bar"><i style="width:${Math.max(0,v/m*100)}%;background:${c}"></i></div>`;
  const cl = CL();
  $("hud").innerHTML =
    `<div>${cl.i} Lv ${P.lv}${bar(P.xp,P.next,"var(--xp)")}</div>` +
    `<div>❤️ ${P.hp}/${P.mhp}${bar(P.hp,P.mhp,"var(--hp)")}</div>` +
    `<div>🔷 ${P.mp}/${P.mmp}${bar(P.mp,P.mmp,"var(--mp)")}</div>` +
    `<div>💰 ${P.gold} 🧪${P.potion} 🔹${P.ether}<br>⚔️${tAtk()} 🛡️${tDef()}${P.pts?` <b style="color:var(--xp)">+${P.pts}</b>`:""}</div>`;
  const a = A(), c = G.cleared[G.area];
  const goal = a.last ? (c ? "已通關!" : "目標:擊敗 "+a.boss.n) : (c ? "前往傳送門 🌀" : "目標:擊敗 "+a.boss.n);
  const party = P.party.map(id => COMPS[id].i).join("");
  $("area").innerHTML = `📍 ${a.hidden ? "隱藏" : "第 "+(G.area+1)+" 章"} · ${a.name}　<small>${goal}${G.shards ? " · ⭐"+G.shards+"/4" : ""}${party ? " · 夥伴 "+party : ""} · ${DIFFS[G.diff].n}</small>`;
}
function draw() {
  const a = A(), th = THEMES[a.th], g = cur();
  ctx.clearRect(0,0,N*T,N*T);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let y=0;y<N;y++) for (let x=0;x<N;x++) {
    const t = g[y][x], cx = x*T+T/2, cy = y*T+T/2+1;
    let bg = th.f[(x+y)%2], ic = "";
    if (t==="#" || t==="F") { bg = th.obs[1]; ic = t==="#" ? "" : th.obs[0]; }
    else if (t==="~") { bg = th.liq[1]; ic = th.liq[0]; }
    else if (t===">" || t==="<") ic = "🌀";
    else if (t==="H") ic = th.h;
    else if (t==="S") ic = "🏪";
    else if (t==="N") ic = a.npc.i;
    else if (t==="M") ic = COMPS[a.comp.id].i;
    else if (t==="$") ic = "📦";
    else if (t==="*") ic = "🎁";
    else if (t==="B") ic = a.boss.i;
    ctx.fillStyle = bg; ctx.fillRect(x*T,y*T,T,T);
    ctx.font = (T*.83|0) + "px serif";
    if (ic) ctx.fillText(ic, cx, cy);
    else if (t==="." && (x*7+y*13)%9===0) { ctx.globalAlpha = .5; ctx.fillText(th.deco, cx, cy); ctx.globalAlpha = 1; }
  }
  ctx.font = (T*.92|0) + "px serif";
  ctx.fillText(CL().i, P.x*T+T/2, P.y*T+T/2+1);
}

// ---------- 移動 ----------
function move(dx,dy) {
  if (inBattle) return;
  const nx = P.x+dx, ny = P.y+dy;
  if (nx<0||ny<0||nx>=N||ny>=N) return;
  const g = cur(), t = g[ny][nx], a = A();
  if (t==="N") { talk(); return; }
  if (t==="M") { talkComp(); return; }
  if (BLOCK.has(t)) { say(t==="~" ? "過不去。" : "被擋住了。"); return; }
  if (t===">") {
    const nxt = AREAS[G.area+1];
    if (!G.cleared[G.area]) { say("🌀 傳送門被封印了,先擊敗守護者!"); return; }
    if (nxt && nxt.req && G.shards < nxt.req.shards) { say(`🌀 傳送門閃著微光,卻還缺少力量……需要 ⭐星之碎片 ${nxt.req.shards} 枚(目前 ${G.shards})。碎片藏在第 2~5 章的 🎁 裡。`); return; }
  }
  P.x = nx; P.y = ny; draw();
  if (t==="H") {
    P.hp = P.mhp; P.mp = P.mmp; hud(); save(); beep(660,.12,"triangle");
    say(`${THEMES[a.th].h} 好好休息了一下,HP / MP 全部回復!`);
  } else if (t==="S") openShop();
  else if (t==="$") openChest(nx, ny);
  else if (t==="*") openStar(nx, ny);
  else if (t===">") goArea(G.area+1, false);
  else if (t==="<") goArea(G.area-1, true);
  else if (t==="B") { say(`${a.boss.i} ${a.boss.n} 擋住了去路!`); startBattle(mk(a.boss)); }
  else if (t==="." && Math.random() < a.rate) {
    const e = a.e[rnd(0, a.e.length-1)];
    startBattle(mk(e, Math.random() < .06));
  } else say("");
}
function goArea(i, back) {
  G.area = i;
  const a = AREAS[i];
  [P.x, P.y] = back ? a.gate.b : a.from;
  hud(); draw(); save(); jingle([523,659]);
  say(`🌀 你來到了「${a.name}」。${a.hidden && !back ? "<br>✨ 這裡是隱藏關卡,敵人非常強大!" : ""}`);
}
function mk(e, elite) {
  const d = DIFFS[G.diff];
  const f = { ...e, base:e.n };
  f.hp = f.mhp = Math.round(e.hp*d.hp); f.atk = Math.round(e.atk*d.atk);
  f.xp = Math.round(e.xp*d.r); f.g = Math.round(e.g*d.r);
  if (elite) { f.n = "精英" + e.n; f.hp = f.mhp = Math.round(f.hp*1.4); f.atk = Math.round(f.atk*1.3); f.xp *= 2; f.g *= 2; f.elite = true; }
  return f;
}

// ---------- 寶箱 / 碎片 / NPC / 夥伴 ----------
function openChest(x, y) {
  const key = [G.area,x,y].join(",");
  if (G.opened[key]) return;
  G.opened[key] = 1; cur()[y][x] = ".";
  const r = Math.random(); let msg;
  if (r < .5)      { const g = rnd(15,30)*(G.area+1); P.gold += g; msg = `💰 ${g} 金幣`; }
  else if (r < .8) { const n = rnd(1,2); P.potion += n; msg = `🧪 藥水 x${n}`; }
  else if (r < .92){ P.ether++; msg = "🔹 魔力水 x1"; }
  else             { P.pts++; msg = "✨ 能力點 +1"; }
  hud(); save(); beep(880,.1,"triangle"); say(`📦 打開寶箱,獲得 ${msg}!`);
}
function openStar(x, y) {
  const key = [G.area,x,y].join(",");
  if (G.opened[key]) return;
  G.opened[key] = 1; cur()[y][x] = "."; G.shards++; P.pts++;
  hud(); save(); jingle([784,988,1175]);
  say(`🎁 找到了 <b>⭐ 星之碎片</b>!(${G.shards}/4)能力點 +1。${G.shards>=4 ? "<br>✨ 四枚碎片集齊了!魔王城深處的傳送門將會回應你。" : ""}`);
}
function rewardText(r) {
  const out = [];
  if (r.g) { P.gold += r.g; out.push(`💰${r.g}`); }
  if (r.pts) { P.pts += r.pts; out.push(`✨能力點+${r.pts}`); }
  if (r.potion) { P.potion += r.potion; out.push(`🧪x${r.potion}`); }
  if (r.ether) { P.ether += r.ether; out.push(`🔹x${r.ether}`); }
  return out.join(" ");
}
function talk() {
  const n = A().npc, s = G.q[G.area] || (G.q[G.area] = { i:0, st:0, c:0 });
  const q = n.quests[s.i];
  let body;
  if (!q) body = n.after;
  else if (s.st === 0) { s.st = 1; body = `${q.say}<br><br>📜 <b>任務 ${s.i+1}/${n.quests.length}</b>:${q.txt}(${s.c}/${q.n})`; }
  else if (s.c >= q.n) { body = `太棒了!這是你的報酬。<br><br>🎁 ${rewardText(q.r)}`; s.i++; s.st = 0; s.c = 0; jingle([523,659,784]);
    if (s.i < n.quests.length) body += `<br><br><small>(再和我說話,還有下一個委託。)</small>`; }
  else body = `${n.wait}<br><br>📜 進度 ${s.c}/${q.n}`;
  openModal(`<h2>${n.i} ${n.n}</h2><div style="line-height:1.6">${body}</div><button style="margin-top:12px" onclick="closeModal()">好</button>`);
  hud(); save();
}
function talkComp() {
  const c = A().comp, def = COMPS[c.id];
  let body;
  if (G.comps[c.id]) body = `${def.i} ${def.n}:「我會陪著你。」(在角色面板可以調整出戰夥伴)`;
  else if (!def.need()) body = `${def.i} ${def.n}:「${def.needTxt}」`;
  else {
    G.comps[c.id] = true;
    if (P.party.length < 2) P.party.push(c.id);
    body = `${def.i} <b>${def.n}</b> 加入了隊伍!<br>能力:${def.d}。<br><small>最多同時出戰 2 位夥伴,可在角色面板調整。</small>`;
    jingle([523,659,784,1047]);
  }
  openModal(`<h2>${def.i} ${def.n}</h2><div style="line-height:1.6">${body}</div><button style="margin-top:12px" onclick="closeModal()">好</button>`);
  hud(); save();
}

// ---------- 戰鬥 ----------
function fx(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function startBattle(e) {
  foe = e; foe.turn = 0; inBattle = true; busy = false; P.poison = null; P.dodge = 0;
  $("battle").style.display = "flex";
  $("battle").style.background = THEMES[A().th].bg + "f2";
  $("foeIcon").textContent = foe.i; $("foeName").textContent = foe.n;
  $("blog").innerHTML = `${foe.elite ? "⚠️ " : ""}${foe.n} 出現了!`;
  refreshBattle();
}
function renderCmds() {
  const c = $("cmds"); c.innerHTML = "";
  const add = (label, fn, id) => { const b = document.createElement("button"); b.textContent = label; b.onclick = fn; b.id = id||""; c.appendChild(b); };
  add("⚔️ 攻擊", () => playerAct("atk"), "bAtk");
  CL().sk.filter(k => P.lv >= k.lv).forEach(k => add(`${k.n} (${k.mp})`, () => playerAct(k.id), "sk_"+k.id));
  add(`🧪 藥水 x${P.potion}`, () => playerAct("potion"), "bPot");
  add(`🔹 魔力水 x${P.ether}`, () => playerAct("ether"), "bEth");
  add("🏃 逃跑", () => playerAct("run"), "bRun");
}
function refreshBattle() {
  $("foeHp").style.width = Math.max(0, foe.hp/foe.mhp*100) + "%";
  renderCmds();
  document.querySelectorAll("#cmds button").forEach(b => b.disabled = busy);
  CL().sk.forEach(k => { const b = $("sk_"+k.id); if (b && P.mp < k.mp) b.disabled = true; });
  if (P.potion <= 0) $("bPot").disabled = true;
  if (P.ether <= 0) $("bEth").disabled = true;
  hud();
}
function blog(t) { $("blog").innerHTML += "<br>" + t; }

function castSkill(k) {
  const cl = CL(), a = tAtk(); let tot = 0;
  const strike = (m, add, force) => {
    let d = Math.round(a*m*cl.sp) + (add ? rnd(add[0], add[1]) : 0);
    const c = force || Math.random() < cl.crit; if (c) d = Math.round(d*1.8);
    foe.hp -= d; tot += d; return c ? d+"!" : ""+d;
  };
  if (k.m) {
    const parts = []; for (let i=0;i<(k.hits||1);i++) parts.push(strike(k.m, k.add, k.crit));
    blog(`${k.n}!造成 ${tot} 傷害${parts.length>1 ? "("+parts.join("+")+")" : (parts[0].endsWith("!") ? " 暴擊!" : "")}`);
    fx($("foeIcon"), "shake"); beep(260,.1,"sawtooth");
  }
  if (k.drain) { const h = Math.ceil(tot/2); P.hp = Math.min(P.mhp, P.hp+h); blog(`回復 ${h} HP。`); }
  if (k.stun && !foe.boss && Math.random() < k.stun) { foe.stun = 1; blog(`💫 ${foe.n} 無法行動!`); }
  if (k.poison) { foe.poison = { d:k.poison.d + Math.floor(P.lv/2), t:k.poison.t }; blog(`☠️ ${foe.n} 中毒了。`); }
  if (k.heal) { const h = k.heal.f ? Math.round(P.mhp*k.heal.f) : 15 + P.lv*2; P.hp = Math.min(P.mhp, P.hp+h); blog(`💚 恢復了 ${h} HP。`); beep(660,.12,"triangle"); }
  if (k.dodge) { P.dodge = k.dodge; blog(`🌫️ 你化作殘影,將閃避接下來 ${k.dodge} 次攻擊。`); }
}
function companionTurn() {
  P.party.forEach(id => {
    if (foe.hp <= 0) return;
    if (id === "wolf") { const d = Math.round(tAtk()*.5) + rnd(0,3); foe.hp -= d; blog(`🐺 白狼撲咬,造成 ${d} 傷害。`); }
    else if (id === "fairy") { const h = 5 + Math.round(P.lv*1.5); P.hp = Math.min(P.mhp, P.hp+h); blog(`🧚 妖精為你療傷,回復 ${h} HP。`); }
  });
}
function playerAct(kind) {
  if (busy) return;
  busy = true; $("blog").innerHTML = "";
  const cl = CL(), a = tAtk(), sk = cl.sk.find(k => k.id === kind);
  if (sk) { P.mp -= sk.mp; castSkill(sk); }
  else if (kind==="atk") {
    let d = Math.round(rnd(a-1, a+3) * cl.basic); const c = Math.random() < cl.crit; if (c) d = Math.round(d*1.8);
    foe.hp -= d; blog(`你攻擊 ${foe.n},造成 ${d} 傷害${c?" 暴擊!":"!"}`); fx($("foeIcon"), "shake"); beep(c?440:200,.08,"square");
  }
  else if (kind==="potion") { P.potion--; P.hp = Math.min(P.mhp, P.hp+25); blog("🧪 喝下藥水,回復 25 HP。"); beep(660,.1,"triangle"); }
  else if (kind==="ether") { P.ether--; P.mp = Math.min(P.mmp, P.mp+15); blog("🔹 喝下魔力水,回復 15 MP。"); beep(740,.1,"triangle"); }
  else if (kind==="run") {
    if (foe.boss) blog("守護者不讓你逃跑!");
    else if (Math.random() < 0.6) { endBattle("你成功逃跑了。"); return; }
    else blog("逃跑失敗!");
  }
  companionTurn();
  if (foe.rage && !foe.raged && foe.hp > 0 && foe.hp <= foe.mhp/2) {
    foe.raged = true; foe.atk += 8; foe.hp = Math.min(foe.mhp, foe.hp + Math.round(foe.mhp*.1));
    blog(`<b>😡 ${foe.n} 狂暴了!攻擊力上升並回復了體力!</b>`); beep(110,.3,"sawtooth",.06);
  }
  refreshBattle();
  if (foe.hp <= 0) return win();
  setTimeout(foeTurn, 600);
}
function foeTurn() {
  foe.turn++;
  if (foe.poison && foe.poison.t > 0) {
    foe.hp -= foe.poison.d; foe.poison.t--; blog(`☠️ ${foe.n} 受毒侵蝕,損失 ${foe.poison.d} HP。`);
    if (foe.hp <= 0) { refreshBattle(); return win(); }
  }
  if (foe.stun) { foe.stun = 0; blog(`💫 ${foe.n} 還在昏眩,無法行動!`); busy = false; return refreshBattle(); }
  if (foe.tr === "heal" && Math.random() < .25) { const h = Math.round(foe.mhp*.12); foe.hp = Math.min(foe.mhp, foe.hp+h); blog(`✨ ${foe.n} 自我修復了 ${h} HP。`); }
  const heavy = foe.boss && foe.turn % 3 === 0;
  const crit = foe.tr === "crit" && Math.random() < .25;
  if (P.dodge > 0) { P.dodge--; blog(`🌫️ 你閃過了 ${foe.n} 的攻擊!`); }
  else if (Math.random() < CL().dodge) blog(`💨 你敏捷地閃過了 ${foe.n} 的攻擊!`);
  else if (P.party.includes("knight") && Math.random() < .3) blog(`💂 騎士擋下了 ${foe.n} 的攻擊!`);
  else {
    const mult = heavy ? 1.6 : crit ? 1.6 : 1;
    const d = Math.max(1, Math.round(rnd(foe.atk-2, foe.atk+2) * mult) - tDef());
    P.hp -= d; blog(`${foe.n} ${heavy ? "蓄力重擊" : crit ? "致命一擊" : "攻擊你"},受到 ${d} 傷害!`);
    fx($("wrap"), "flash"); beep(140,.12,"sawtooth");
    if (foe.tr === "poison" && Math.random() < .35) { P.poison = { d:2 + G.area, t:3 }; blog("☠️ 你中毒了!"); }
  }
  if (P.poison && P.poison.t > 0) { P.hp -= P.poison.d; P.poison.t--; blog(`☠️ 毒發,損失 ${P.poison.d} HP。`); }
  if (P.hp <= 0) { P.hp = 0; refreshBattle(); return lose(); }
  busy = false; refreshBattle();
}
function levelUp() {
  let msg = "";
  const g = CL().g;
  while (P.xp >= P.next) {
    P.xp -= P.next; P.lv++; P.next = Math.round(P.next*1.3);
    P.mhp += g.hp; P.mmp += g.mp; P.atk += g.atk; P.pts += 3; P.hp = P.mhp; P.mp = P.mmp;
    msg += `<br>⭐ 升級!現在 Lv ${P.lv},獲得 3 點能力點(按 C 配點)。`;
    CL().sk.filter(k => k.lv === P.lv).forEach(k => msg += `<br>✨ 習得技能 ${k.n}!`);
    jingle([523,659,784,1047]);
  }
  return msg;
}
function win() {
  const a = A();
  P.xp += foe.xp; P.gold += foe.g;
  let msg = `擊敗 ${foe.n}!獲得 ${foe.xp} 經驗、${foe.g} 金幣。`;
  jingle([392,523,659]);
  if (foe.boss) {
    G.cleared[G.area] = true; const [bx,by] = a.gate.b; cur()[by][bx] = ".";
    P.pts += 2; msg += `<br>🎁 能力點 +2。`;
    if (a.last) {
      msg += `<br><br>🎉 <b>虛空之主倒下了!你超越了一切傳說,成為真正的傳奇勇者!</b>`;
      G.ended = true;
    } else if (G.area === 5) {
      msg += `<br><br>🎉 <b>魔王被擊敗了!世界恢復和平!</b><br>不過……王座後方的傳送門${G.shards>=4?"正在發光,你可以前往隱藏關卡!":"似乎還需要 ⭐ 星之碎片(" + G.shards + "/4)才能開啟。"}`;
    } else msg += `<br>🌀 傳送門解除封印了!`;
  } else if (Math.random() < 0.2) { P.potion++; msg += " 撿到一瓶🧪藥水!"; }
  const s = G.q[G.area], q = a.npc.quests[s ? s.i : 0];
  if (s && q && s.st === 1 && foe.base === q.k && s.c < q.n) {
    s.c++; msg += `<br>📜 任務進度 ${s.c}/${q.n}${s.c >= q.n ? ",回去找" + a.npc.n + "領獎吧!" : ""}`;
  }
  msg += levelUp();
  endBattle(msg);
}
function lose() {
  $("battle").style.display = "none"; inBattle = false; P.poison = null; P.dodge = 0;
  const lost = Math.floor(P.gold/2); P.gold -= lost;
  P.hp = P.mhp; P.mp = P.mmp; [P.x, P.y] = A().from;
  hud(); draw(); save(); jingle([220,196,165]);
  say(`💀 你倒下了……被好心人送回了章節入口,損失 ${lost} 金幣,HP / MP 已回復。`);
}
function endBattle(msg) {
  inBattle = false; P.poison = null; P.dodge = 0; $("battle").style.display = "none"; hud(); draw(); save(); if (msg) say(msg);
}

// ---------- 面板 ----------
function openModal(html) { const m = $("modal"); m.innerHTML = html; m.style.display = "flex"; inBattle = true; }
function closeModal() { $("modal").style.display = "none"; inBattle = false; hud(); }

function openTitle(pick) {
  const d = typeof pick === "number" ? pick : G.diff;
  G.diff = d;
  openModal(`<h2>⚔️ 勇者物語</h2>
    <div style="opacity:.8">選擇難度:</div>
    <div class="seg">${DIFFS.map((x,i) => `<button class="${i===d?"on":""}" onclick="openTitle(${i})">${x.n}<br><small>${x.d}</small></button>`).join("")}</div>
    <div style="opacity:.8;margin-top:8px">選擇職業開始冒險:</div>
    ${Object.entries(CLASSES).map(([k,c]) => `<button class="card" onclick="startGame('${k}')"><b>${c.i} ${c.n}</b><small>${c.d}</small>
      <small>HP ${c.hp} · MP ${c.mp} · 攻擊 ${c.atk}</small></button>`).join("")}`);
}
function startGame(k) {
  const c = CLASSES[k];
  Object.assign(P, { cls:k, mhp:c.hp, hp:c.hp, mmp:c.mp, mp:c.mp, atk:c.atk });
  [P.x, P.y] = AREAS[0].from;
  closeModal(); hud(); draw(); save();
  say(`你是年輕的${c.n}。先和 🧓 村長 說話接任務,擊敗每章的守護者,穿過 🌀 傳送門,一路挑戰魔王!<br><small>P 藥水 · E 魔力水 · C 角色面板 · 進度會自動存檔</small>`);
}

function openShop() {
  const rows = (list, key) => list.filter(it => it.t <= G.area).map(it => {
    const i = list.indexOf(it), cur = P[key], owned = cur && cur.v >= it.v;
    return `<div class="row"><span>${it.n} ${key==="weapon"?"⚔️":"🛡️"}+${it.v}</span>
      <button onclick="buy('${key}',${i})" ${owned||P.gold<it.p?"disabled":""}>${owned?"已擁有/更強":"💰"+it.p}</button></div>`;
  }).join("");
  openModal(`<h2>🏪 商店 · 💰 ${P.gold}</h2>
    <div class="row"><span>🧪 藥水(回 25 HP)</span><button onclick="buy('potion')" ${P.gold<15?"disabled":""}>💰15</button></div>
    <div class="row"><span>🔹 魔力水(回 15 MP)</span><button onclick="buy('ether')" ${P.gold<25?"disabled":""}>💰25</button></div>
    ${rows(WEAPONS,"weapon")}${rows(ARMORS,"armor")}
    <button style="margin-top:10px" onclick="closeModal()">離開</button>`);
}
function buy(kind, i) {
  if (kind==="potion") { if (P.gold<15) return; P.gold-=15; P.potion++; }
  else if (kind==="ether") { if (P.gold<25) return; P.gold-=25; P.ether++; }
  else { const it = (kind==="weapon"?WEAPONS:ARMORS)[i]; if (P.gold<it.p) return; P.gold-=it.p; P[kind]=it; }
  hud(); save(); beep(520,.08,"triangle"); openShop();
}
function openStats() {
  if (inBattle) return;
  const cl = CL();
  const row = (label, key) => `<div class="row"><span>${label}</span><button onclick="spend('${key}')" ${P.pts<1?"disabled":""}>+ 1點</button></div>`;
  const n = A().npc, s = G.q[G.area] || { i:0, st:0, c:0 }, q = n.quests[s.i];
  const qtxt = !q ? "✅ 本章委託全部完成" : s.st===0 ? `尚未接取(找 ${n.i}${n.n})` : `${q.txt}(${s.c}/${q.n})`;
  const comps = Object.keys(COMPS).filter(id => G.comps[id]);
  openModal(`<h2>${cl.i} ${cl.n} Lv ${P.lv} · 能力點 ${P.pts}</h2>
    <div class="row"><span>❤️ HP ${P.hp}/${P.mhp}</span><span>🔷 MP ${P.mp}/${P.mmp}</span></div>
    <div class="row"><span>⚔️ 攻擊 ${tAtk()} (${P.weapon?P.weapon.n:"徒手"})</span><span>🛡️ 防禦 ${tDef()} (${P.armor?P.armor.n:"布衣"})</span></div>
    ${row("提升 HP 上限 +6","mhp")}${row("提升 MP 上限 +3","mmp")}${row("提升 攻擊 +1","atk")}${row("提升 防禦 +1","def")}
    <h2 style="margin-top:12px">本章任務</h2><div class="row"><span>📜 ${qtxt}</span></div>
    <h2 style="margin-top:12px">夥伴(最多出戰 2 位)</h2>
    ${comps.length ? comps.map(id => `<div class="row"><span>${COMPS[id].i} ${COMPS[id].n} <small>${COMPS[id].d}</small></span>
      <button onclick="togglePartner('${id}')">${P.party.includes(id) ? "✔ 出戰中" : "待命"}</button></div>`).join("")
      : `<div class="row"><span style="opacity:.6">尚無夥伴。到各章找 🐺🧚💂 吧。</span></div>`}
    <h2 style="margin-top:12px">技能</h2>
    ${cl.sk.map(k => `<div class="row" style="opacity:${P.lv>=k.lv?1:.4}"><span>${k.n} <small>${k.d}</small></span><span>${P.lv>=k.lv?"MP "+k.mp:"Lv "+k.lv+" 解鎖"}</span></div>`).join("")}
    <h2 style="margin-top:12px">設定</h2>
    <div style="opacity:.8">難度(隨時可調整)</div>
    <div class="seg">${DIFFS.map((x,i) => `<button class="${i===G.diff?"on":""}" onclick="setDiff(${i})">${x.n}</button>`).join("")}</div>
    <div class="seg"><button onclick="toggleMute()">${G.mute ? "🔇 音效:關" : "🔊 音效:開"}</button></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button style="flex:1" onclick="closeModal()">關閉</button><button onclick="newGame()">🔄 新遊戲</button></div>`);
}
function spend(key) {
  if (P.pts<1) return; P.pts--;
  if (key==="mhp") { P.mhp+=6; P.hp+=6; } else if (key==="mmp") { P.mmp+=3; P.mp+=3; } else P[key]++;
  hud(); save(); openStats();
}
function togglePartner(id) {
  const i = P.party.indexOf(id);
  if (i >= 0) P.party.splice(i,1);
  else { if (P.party.length >= 2) P.party.shift(); P.party.push(id); }
  hud(); save(); closeModal(); openStats();
}
function setDiff(i) { G.diff = i; hud(); save(); closeModal(); openStats(); }
function toggleMute() { G.mute = !G.mute; save(); closeModal(); openStats(); }
$("menuBtn").onclick = openStats;

// 戰鬥外使用道具:P 藥水 / E 魔力水
function usePotion() {
  if (inBattle) return;
  if (P.potion<=0) return say("沒有藥水了。");
  if (P.hp>=P.mhp) return say("HP 已經是滿的。");
  P.potion--; P.hp = Math.min(P.mhp, P.hp+25); hud(); save(); say("🧪 使用藥水,回復 25 HP。");
}
function useEther() {
  if (inBattle) return;
  if (P.ether<=0) return say("沒有魔力水了。");
  if (P.mp>=P.mmp) return say("MP 已經是滿的。");
  P.ether--; P.mp = Math.min(P.mmp, P.mp+15); hud(); save(); say("🔹 使用魔力水,回復 15 MP。");
}

// ---------- 輸入 ----------
const KEYS = { ArrowUp:[0,-1], w:[0,-1], ArrowDown:[0,1], s:[0,1], ArrowLeft:[-1,0], a:[-1,0], ArrowRight:[1,0], d:[1,0] };
addEventListener("keydown", e => {
  if (!P.cls) return;
  if (e.key==="p"||e.key==="P") return usePotion();
  if (e.key==="e"||e.key==="E") return useEther();
  if (e.key==="c"||e.key==="C") return $("modal").style.display==="flex" ? closeModal() : openStats();
  const d = KEYS[e.key] || KEYS[e.key.toLowerCase?.()];
  if (d) { e.preventDefault(); move(...d); }
});
document.querySelectorAll("#pad button").forEach(b =>
  b.addEventListener("click", () => { if (P.cls) move(...b.dataset.d.split(",").map(Number)); }));

// ---------- 開始 ----------
if (load()) {
  hud(); draw(); say("📂 已讀取上次的進度,繼續冒險!");
} else {
  [P.x, P.y] = AREAS[0].from;
  hud(); draw(); openTitle(1);
}
</script>
</body>
</html>
