<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>勇者物語 RPG</title>
<style>
  :root { --bg:#12141c; --panel:#1d2130; --line:#3a4160; --text:#e8ecff; --hp:#e5484d; --mp:#4b8bff; --xp:#f5c542;
          --w:min(96vw, 78vh, 780px); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"Noto Sans TC",sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:12px; user-select:none; }
  h1 { font-size:20px; margin:4px 0 8px; letter-spacing:2px; }
  #wrap { position:relative; width:var(--w); }
  canvas { width:100%; display:block; background:#000; border:2px solid var(--line); border-radius:10px; }
  #area { width:var(--w); font-size:15px; margin-bottom:6px; }
  #area small { opacity:.75; margin-left:6px; }
  #hud { display:flex; gap:10px; font-size:14px; margin:8px 0; width:var(--w); justify-content:space-between;
         background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
  .bar { height:7px; background:#0008; border-radius:4px; overflow:hidden; margin-top:3px; }
  .bar i { display:block; height:100%; }
  #log { width:var(--w); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px;
         min-height:72px; font-size:15px; line-height:1.55; }
  #battle { position:absolute; inset:0; border-radius:10px; display:none; flex-direction:column;
            justify-content:space-between; padding:16px; overflow:auto; }
  #battle .foe { text-align:center; margin-top:6px; }
  #foes { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .fo { text-align:center; cursor:pointer; padding:6px 8px; border-radius:10px; border:2px solid transparent; min-width:96px; }
  .fo.sel { border-color:var(--xp); background:#ffffff12; }
  .fo.dead { opacity:.25; filter:grayscale(1); cursor:default; }
  .fo .ic { display:inline-block; font-size:var(--fs); line-height:1.1; }
  .fo small { display:block; font-size:13px; }
  #blog { min-height:84px; font-size:15px; line-height:1.55; margin-bottom:8px; }
  #cmds { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  #modal { position:absolute; inset:0; background:#0b0d14f7; border-radius:10px; display:none; flex-direction:column;
           padding:16px; overflow:auto; font-size:15px; }
  #modal h2 { margin:0 0 8px; font-size:17px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); }
  .row button { padding:5px 10px; font-size:13px; }
  .seg { display:flex; gap:6px; margin:6px 0; }
  .seg button { flex:1; padding:7px 4px; font-size:14px; }
  .seg button.on { border-color:var(--xp); background:#2a2f45; }
  #toasts { position:absolute; top:10px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; z-index:10; pointer-events:none; width:min(92%,420px); }
  .toast { background:#2a2f45; border:1px solid var(--xp); border-radius:10px; padding:8px 12px; font-size:14px; line-height:1.4; box-shadow:0 4px 18px #0008; animation:pop .25s; }
  @keyframes pop { from { transform:translateY(-10px); opacity:0 } to { transform:none; opacity:1 } }
  .actbar { display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; }
  .actbar button { flex:1; padding:8px 6px; font-size:14px; white-space:nowrap; }
  .tabs { display:flex; gap:6px; margin:8px 0; }
  .tabs button { flex:1; padding:8px 4px; font-size:14px; }
  .tabs button.on { border-color:var(--xp); background:#2a2f45; }
  .igrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:8px; }
  .icard { border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:#161a28; display:flex; flex-direction:column; gap:6px; }
  .icard.on { border-color:var(--xp); background:#1d2132; }
  .ihead { display:flex; justify-content:space-between; align-items:center; gap:6px; }
  .iname { font-weight:600; font-size:14px; }
  .lvb { font-size:12px; border:1px solid var(--line); border-radius:6px; padding:1px 6px; white-space:nowrap; }
  .lvb.bad { border-color:#e5484d; color:#ff8a8f; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { font-size:12px; background:#2a3048; border-radius:6px; padding:2px 7px; white-space:nowrap; }
  .chip.enh { background:#4a3d1c; }
  .chip.up { color:#6fdc8c; } .chip.down { color:#ff7b7b; }
  .cmp { font-size:12px; opacity:.95; display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
  .iact { display:flex; gap:6px; flex-wrap:wrap; }
  .iact button { padding:5px 9px; font-size:13px; }
  .sumbar { display:flex; flex-wrap:wrap; gap:5px; margin:6px 0; }
  .sumbar .chip { background:#232944; font-size:13px; }
  .slots { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:6px 0; }
  .slot { border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:12px; background:#161a28; cursor:pointer; }
  .slot.on { border-color:var(--xp); }
  .slot b { display:block; font-size:13px; margin-top:2px; }
  .card { text-align:left; width:100%; margin-top:8px; }
  .card small { display:block; opacity:.75; margin-top:2px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px;
           font-size:15px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:#8fa0ff; }
  button:disabled { opacity:.4; cursor:default; }
  #cmds button { padding:9px 4px; font-size:14px; }
  #pad { display:none; grid-template-columns:repeat(3,64px); gap:6px; margin-top:10px; }
  @media (pointer:coarse) { #pad { display:grid; } }
  #pad button { height:64px; padding:0; font-size:22px; }
  .tip { font-size:12px; opacity:.6; margin-top:8px; width:var(--w); text-align:center; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-12px)} 75%{transform:translateX(12px)} }
  .shake { animation:shake .25s; }
  @keyframes flash { 0%{box-shadow:inset 0 0 0 999px #e5484d88} 100%{box-shadow:inset 0 0 0 999px #e5484d00} }
  .flash { animation:flash .35s; }
</style>
</head>
<body>
<h1>⚔️ 勇者物語</h1>
<div id="area"></div>
<div id="hud"></div>
<div id="wrap">
  <canvas id="c" width="720" height="720"></canvas>
  <div id="battle">
    <div id="foes"></div>
    <div>
      <div id="blog"></div>
      <div id="cmds"></div>
    </div>
  </div>
  <div id="modal"></div>
  <div id="toasts"></div>
</div>
<div id="log"></div>
<button id="menuBtn" style="margin-top:8px">📋 角色 / 技能 / 夥伴 / 設定 (C) · 🎒 裝備 (I) · 📖 圖鑑 (B)</button>
<div id="pad">
  <span></span><button data-d="0,-1">▲</button><span></span>
  <button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button>
</div>
<div class="tip">方向鍵 / WASD 移動 · 與 NPC 說話接任務 · 🏠旅店回復 · 🏪商店 · 📦寶箱 · 擊敗守護者開啟🌀傳送門 · 集齊 4 枚 ⭐ 星之碎片可進入隱藏關卡 · 🗼試煉之塔(T) · 🏆成就(V)</div>

<script>
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function say(t) { $("log").innerHTML = t; }

// ---------- 音效(簡單的 WebAudio 嗶聲) ----------
let AC;
function beep(f, d=.09, type="square", v=.035) {
  if (G.mute) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(AC.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d); o.stop(AC.currentTime + d);
  } catch(e) {}
}
const jingle = notes => notes.forEach((f,i) => setTimeout(() => beep(f,.14,"triangle",.05), i*110));

// ---------- 職業 / 技能 / 夥伴 ----------
// 技能欄位:m 倍率 · add 額外傷害 · hits 連擊 · crit 必爆 · stun 暈眩機率 · poison 中毒 · drain 吸血 · heal 治療 · dodge 閃避次數
const CLASSES = {
  war: { n:"戰士", i:"🦸", d:"高 HP 與攻擊,技能耗魔少,近戰最穩", hp:40, mp:6, atk:7, g:{hp:7,mp:1,atk:1}, sp:1, basic:1, crit:.08, dodge:0,
    sk:[ {id:"slash", n:"🗡️ 強斬", lv:1, mp:3, m:1.8, add:[0,3], d:"1.8 倍 ATK"},
         {id:"roar",  n:"📣 戰吼", lv:2, mp:5, heal:{f:.3}, d:"回復 30% HP"},
         {id:"bash",  n:"🛡️ 盾擊", lv:3, mp:4, m:1.3, stun:.6, d:"1.3 倍並可能暈眩"},
         {id:"whirl", n:"🌪️ 旋風斬", lv:6, mp:9, m:2.2, add:[0,3], aoe:true, d:"全體:各 2.2 倍 ATK"},
         {id:"drain", n:"🩸 吸血", lv:8, mp:8, m:1.6, add:[0,3], drain:true, d:"傷害並回復一半"},
         {id:"titan", n:"💥 破天一擊", lv:10, mp:15, m:4.8, add:[0,8], d:"4.8 倍 ATK"} ] },
  mage:{ n:"法師", i:"🧙", d:"MP 多、技能威力高,但普通攻擊偏弱", hp:24, mp:18, atk:5, g:{hp:4,mp:4,atk:1}, sp:1.15, basic:.8, crit:.08, dodge:0,
    sk:[ {id:"fire",  n:"🔥 火球", lv:1, mp:4, m:1, add:[4,9], d:"ATK + 4~9"},
         {id:"heal",  n:"💚 治療", lv:1, mp:5, heal:{flat:true}, d:"回復 HP"},
         {id:"frost", n:"❄️ 冰錐", lv:3, mp:5, m:1.6, stun:.4, d:"1.6 倍並可能凍結"},
         {id:"thunder",n:"⚡ 雷擊", lv:5, mp:8, m:2, add:[0,4], aoe:true, d:"全體:各 2 倍 ATK"},
         {id:"drain", n:"🩸 吸血", lv:7, mp:7, m:1.5, add:[0,3], drain:true, d:"傷害並回復一半"},
         {id:"meteor",n:"☄️ 流星", lv:9, mp:14, m:3.2, add:[0,6], aoe:true, d:"全體:各 3.2 倍 ATK"} ] },
  rogue:{ n:"遊俠", i:"🧝", d:"高暴擊與閃避,擅長連擊與毒", hp:30, mp:10, atk:6, g:{hp:5,mp:2,atk:1}, sp:1, basic:1, crit:.2, dodge:.12,
    sk:[ {id:"volley",n:"🏹 連射", lv:1, mp:3, m:.9, hits:2, add:[0,2], spread:true, d:"隨機射出 2 箭"},
         {id:"aid",   n:"🩹 急救", lv:1, mp:5, heal:{flat:true}, d:"回復 HP"},
         {id:"poison",n:"☠️ 毒箭", lv:3, mp:4, m:1.1, poison:{d:3,t:4}, d:"傷害並使敵人中毒"},
         {id:"assas", n:"🗡️ 暗殺", lv:5, mp:7, m:3, crit:true, d:"必定暴擊"},
         {id:"shadow",n:"🌫️ 影分身", lv:7, mp:6, dodge:2, d:"閃避接下來 2 次攻擊"},
         {id:"rain",  n:"🌧️ 百裂箭", lv:9, mp:13, m:.8, hits:5, add:[0,2], spread:true, d:"隨機射出 5 箭"} ] },
};
const COMPS = {
  wolf:  { n:"白狼", i:"🐺", d:"每回合咬擊敵人", need:() => qDone(0,1), needTxt:"先完成村長的第一個託付,我才信得過你。",
    perks:[[1,"每回合咬擊(傷害隨等級提升)"],[5,"咬擊使敵人流血"],[10,"同時咬擊兩個目標"],[15,"傷害 +25%"]] },
  fairy: { n:"妖精", i:"🧚", d:"每回合為你療傷", need:() => G.cleared[1], needTxt:"打倒巨型蜘蛛吧,牠把我的族人都關起來了……",
    perks:[[1,"每回合療傷(回復量隨等級提升)"],[5,"療傷時解除中毒/灼燒"],[10,"每回合回復少量 MP"],[15,"你倒下時復活一次(每場戰鬥)"]] },
  knight:{ n:"騎士", i:"💂", d:"機率擋下攻擊", need:() => qDone(5,1), needTxt:"幫流浪騎士解決魔騎士,他會認可你。",
    perks:[[1,"30% 機率擋下攻擊(每級 +1%,上限 55%)"],[5,"減少你受到的傷害"],[10,"擋下攻擊時反擊"],[15,"減傷再提升"]] },
};
const compLv = id => (G.comps[id] && G.comps[id].lv) || 1;
const compXpNeed = lv => Math.round(15 * Math.pow(1.28, lv-1));
function compDesc(id) {
  const lv = compLv(id), pk = COMPS[id].perks, next = pk.find(p => p[0] > lv);
  return pk.filter(p => p[0] <= lv).map(p => p[1]).join("、") + (next ? ` · Lv ${next[0]} 解鎖:${next[1]}` : "");
}
function compGain(total) {   // 出戰夥伴獲得 60% 經驗,待命夥伴 30%
  let msg = "";
  Object.keys(G.comps).forEach(id => {
    const c = G.comps[id]; if (!c) return;
    c.xp += Math.round(total * (P.party.includes(id) ? .6 : .3));
    while (c.lv < 30 && c.xp >= compXpNeed(c.lv)) {
      c.xp -= compXpNeed(c.lv); c.lv++;
      const pk = COMPS[id].perks.find(p => p[0] === c.lv);
      msg += `<br>${COMPS[id].i} ${COMPS[id].n} 升到 Lv ${c.lv}!${pk ? " 解鎖:" + pk[1] : ""}`; jingle([523,659,784]);
    }
  });
  return msg;
}
const DIFFS = [
  { n:"簡單", hp:.75, atk:.8,  r:1,   d:"敵人較弱" },
  { n:"普通", hp:1.1, atk:1.05, r:1,   d:"標準體驗" },
  { n:"困難", hp:1.5, atk:1.3, r:1.3, d:"敵人更強,獎勵 +30%" },
  { n:"地獄", hp:2,   atk:1.6, r:1.8, d:"極限挑戰,獎勵 +80%" },
];

// ---------- 章節資料 ----------
// . 地面  # 邊界  F 障礙  ~ 水/岩漿/冰  H 旅店  S 商店  N NPC  M 夥伴  $ 寶箱  * 星之碎片  B 守護者  > 前往  < 返回
const T = 36, N = 20;
const cv = $("c"), ctx = cv.getContext("2d");
const THEMES = {
  grass:  { f:["#3e8e41","#439a47"], deco:"🌱", obs:["🌳","#2b6a33"], liq:["〰️","#2f6fd6"], h:"🏠", bg:"#0d1a10" },
  forest: { f:["#1f4a2a","#245432"], deco:"🍄", obs:["🌲","#143520"], liq:["〰️","#285a73"], h:"⛺", bg:"#08130c" },
  desert: { f:["#d9b66a","#e0c07b"], deco:"🦴", obs:["🌵","#c9a455"], liq:["💧","#2f8fd6"], h:"⛲", bg:"#2a2112" },
  snow:   { f:["#e3edf7","#d6e4f2"], deco:"❄️", obs:["🗻","#9fb3c8"], liq:["🧊","#7fc3e8"], h:"🛖", bg:"#101a26" },
  cave:   { f:["#4a4152","#51485a"], deco:"🪨", obs:["🪨","#2e2833"], liq:["🔥","#a8421f"], h:"🔥", bg:"#120e16" },
  castle: { f:["#3a2f46","#41354e"], deco:"🕯️", obs:["🗿","#241c2e"], liq:["🔥","#7a1f1f"], h:"🛏️", bg:"#1a0b14" },
  temple: { f:["#c9b36a","#d3bd75"], deco:"✨", obs:["🏛️","#8a7a3f"], liq:["🔮","#3a2f7a"], h:"⛩️", bg:"#1f1a0a" },
  void:   { f:["#1a1033","#20143d"], deco:"⭐", obs:["🌌","#0c0820"], liq:["⚫","#05020f"], h:"🌠", bg:"#05020f" },
};
const ESKILL = {
  venom:{n:"毒牙",i:"☠️",t:"攻擊可能使你中毒"}, crit:{n:"致命",i:"🎯",t:"可能打出致命一擊"}, regen:{n:"再生",i:"✨",t:"會自我修復"},
  bash:{n:"重擊",i:"💥",p:.18,t:"重擊並使你下回合無法行動"}, multi:{n:"連擊",i:"⚔️",p:.3,t:"連續攻擊兩次"},
  drain:{n:"吸血",i:"🩸",p:.3,t:"攻擊並回復自己"}, fire:{n:"火焰",i:"🔥",p:.3,t:"強力灼燒,使你持續受傷"},
  curse:{n:"詛咒",i:"🌀",p:.25,t:"3 回合內降低你造成的傷害"}, guard:{n:"防禦",i:"🛡️",p:.2,t:"防禦姿態,減半受到的下一次傷害"},
  barrier:{n:"護盾",i:"🔰",p:.2,t:"為自己張開護盾"}, rally:{n:"鼓舞",i:"📣",p:.25,t:"治療同伴"},
  steal:{n:"偷竊",i:"💰",p:.3,t:"偷走你的金幣,打倒牠可奪回"}, boom:{n:"自爆",i:"💣",t:"瀕死時自爆,不給獎勵"},
};
const ACTIVE = ["bash","multi","drain","fire","curse","guard","barrier","rally","steal"];
const LEGACY = { poison:"venom", heal:"regen" };
const E = (n,i,hp,atk,xp,g,sk) => ({ n, i, hp, atk, xp, g, sk:[].concat(sk || []).map(x => LEGACY[x] || x) });
const Q = (k,n,r,say) => ({ k, n, txt:`擊敗 ${n} 隻${k}`, r, say });
const AREAS = [
  { name:"翠綠草原", th:"grass", rate:.13, from:[2,17],
    e:[E("史萊姆","🟢",12,3,6,4), E("哥布林","👺",20,5,10,8,"steal"), E("野狼","🐺",22,6,12,9,"multi"), E("野豬","🐗",28,6,14,10,"bash"), E("毒蘑菇","🍄",18,5,11,8,"venom")],
    boss:{ sum:{ every:3, n:2, e:E("史萊姆","🟢",12,3,0,0) }, drop:"d_slime", sk:["bash"], n:"史萊姆王", i:"👑", hp:70, atk:8, xp:50, g:60, boss:true },
    gate:{ b:[18,2], p:[18,1] }, H:[4,15], S:[6,15], $:[[15,16],[10,5]], comp:{ id:"wolf", at:[8,9] },
    npc:{ at:[3,12], n:"村長", i:"🧓", wait:"還沒完成呢,加油!", after:"往東北方走,打倒史萊姆王就能前往森林。",
      quests:[ Q("史萊姆",3,{g:40,pts:1},"年輕人,魔王的陰影正籠罩大地……先幫我清掉草原上的史萊姆吧。"),
               Q("哥布林",5,{g:80,potion:2,ether:1},"哥布林偷了我們的糧食,再麻煩你教訓牠們一下。") ] } },
  { name:"幽暗森林", th:"forest", rate:.14, from:[2,18], pb:[1,18],
    e:[E("蝙蝠","🦇",22,7,14,10,"drain"), E("毒蜘蛛","🕷️",30,8,18,13,"venom"), E("樹精","🌲",38,9,22,16,"guard"), E("食人花","🌺",34,9,20,15,["venom","guard"]), E("狐妖","🦊",30,9,21,15,["curse","crit"])],
    boss:{ sum:{ every:3, n:2, e:E("小蜘蛛","🕷️",16,6,0,0,"poison") }, drop:"d_web", sk:["venom","multi"], n:"巨型蜘蛛", i:"🕸️", hp:130, atk:12, xp:100, g:100, boss:true },

function rollItem(tier, elite, rare) {
  const t = Math.max(0, Math.min(7, tier));
  const w = rare ? [0,30,50,20] : elite ? [20,45,28,7] : [60,30,9,1];
  let r = rnd(1,100), ri = 0, acc = 0;
  for (let i=0;i<4;i++) { acc += w[i]; if (r <= acc) { ri = i; break; } }
  const q = Math.random(), slot = q < .35 ? "weapon" : q < .7 ? "armor" : "acc";
  if (slot === "acc" && ri === 0) ri = 1;
  const id = "g" + (++G.genSeq), it = { id, gen:true, slot, rar:ri, t, lv:Math.max(1, LV_REQ[t] + (t ? rnd(-1,1) : 0)) };
  if (slot === "acc") { const [n,i] = ACC_NAMES[rnd(0, ACC_NAMES.length-1)]; it.n = `[${RARITY[ri].n}] ${n}`; it.i = i; }
  else {
    const bases = ITEMLIST.filter(x => x.cls === P.cls && x.slot === slot && !x.drop && x.t <= t);
    const base = bases[bases.length-1]; it.cls = P.cls; it.n = `[${RARITY[ri].n}] ${base.n}`;
    if (slot === "weapon") it.atk = base.atk; else it.def = base.def;
  }
  const keys = Object.keys(AFFIX).sort(() => Math.random() - .5);
  for (let i=0;i<ri;i++) it[keys[i]] = (it[keys[i]] || 0) + AFFIX[keys[i]](t);
  it.p = Math.round(PRICE[t] * RARITY[ri].m * .5);
  G.gen[id] = it; ITEMS[id] = it;
  return it;
}

}

  for (let k=0;k<15;k++) blob("F", 1+Math.floor(r()*3), 1+Math.floor(r()*3));
  for (let k=0;k<3;k++) blob("~", 2+Math.floor(r()*2), 2+Math.floor(r()*3));
  const carve = (p, q) => { let [x,y] = p; const set = () => { if (x>0&&y>0&&x<N-1&&y<N-1) g[y][x] = "."; };
    while (x !== q[0]) { set(); x += Math.sign(q[0]-x); }
    while (y !== q[1]) { set(); y += Math.sign(q[1]-y); }
    set(); };
  const pts = [a.from, a.H, a.S, a.npc.at, ...a.$];
  if (a.comp) pts.push(a.comp.at);
  if (a.star) pts.push(a.star);
  pts.push(a.gate.b);
  for (let i=1;i<pts.length;i++) carve(pts[i-1], pts[i]);
  if (a.pb) carve(a.from, a.pb);
  const { b, p } = a.gate;
  if (p) {
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy]) => {
      const x = p[0]+dx, y = p[1]+dy;
      if ((x !== b[0] || y !== b[1]) && x>=0 && y>=0 && x<N && y<N) g[y][x] = "#";
    });
    g[p[1]][p[0]] = ">";
  }
  g[b[1]][b[0]] = "B";
  g[a.H[1]][a.H[0]] = "H"; g[a.S[1]][a.S[0]] = "S"; g[a.npc.at[1]][a.npc.at[0]] = "N";
  a.$.forEach(([x,y]) => g[y][x] = "$");
  if (a.comp) g[a.comp.at[1]][a.comp.at[0]] = "M";
  if (a.star) g[a.star[1]][a.star[0]] = "*";
  if (a.pb) g[a.pb[1]][a.pb[0]] = "<";
  return g;
}
function gridOf(i) { if (!grids[i]) grids[i] = build(i); return grids[i]; }
const cur = () => gridOf(G.area);
function applyState() {
  G.cleared.forEach((c,i) => { if (c) { const [x,y] = AREAS[i].gate.b; gridOf(i)[y][x] = "."; } });
  Object.keys(G.opened).forEach(k => { const [ai,x,y] = k.split(",").map(Number); gridOf(ai)[y][x] = "."; });
}

// ---------- 存檔 ----------
const SAVE = "rpg_save_v3";
function save() { try { localStorage.setItem(SAVE, JSON.stringify({ P, G })); } catch(e) {} }
function load() {
  try { const s = JSON.parse(localStorage.getItem(SAVE)); if (!s || !s.P || !s.P.cls) return false;
    Object.assign(P, s.P); Object.assign(G, s.G);
    Object.values(G.gen || {}).forEach(it => ITEMS[it.id] = it);
    Object.keys(G.comps || {}).forEach(id => { if (G.comps[id] === true) G.comps[id] = { lv:Math.max(1, Math.floor(P.lv*.7)), xp:0 }; });
    if (!s.P.eq) {   // 舊存檔:換成同章節的職業專屬裝備
      const old = { weapon:P.weapon, armor:P.armor }; delete P.weapon; delete P.armor; P.eq = {}; P.owned = [];
      Object.keys(old).forEach(sl => { const o = old[sl], it = o && ITEMLIST.find(x => x.slot===sl && x.cls===P.cls && x.t===o.t);
        if (it) { P.owned.push(it.id); equip(it.id); } });

}

function draw() {
  const a = A(), th = THEMES[a.th], g = cur();

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let y=0;y<N;y++) for (let x=0;x<N;x++) {
    const t = g[y][x], cx = x*T+T/2, cy = y*T+T/2+1;
    let bg = th.f[(x+y)%2], ic = "";

    else if (t==="~") { bg = th.liq[1]; ic = th.liq[0]; }
    else if (t===">" || t==="<") ic = "🌀";
    else if (t==="H") ic = th.h;
    else if (t==="S") ic = "🏪";
    else if (t==="N") ic = a.npc.i;
    else if (t==="M") ic = COMPS[a.comp.id].i;
    else if (t==="$") ic = "📦";
    else if (t==="*") ic = "🎁";
    else if (t==="B") ic = a.boss.i;
    ctx.fillStyle = bg; ctx.fillRect(x*T,y*T,T,T);

    else if (t==="." && (x*7+y*13)%9===0) { ctx.globalAlpha = .5; ctx.fillText(th.deco, cx, cy); ctx.globalAlpha = 1; }

// ---------- 移動 ----------
function move(dx,dy) {
  if (inBattle) return;
  const nx = P.x+dx, ny = P.y+dy;
  if (nx<0||ny<0||nx>=N||ny>=N) return;
  const g = cur(), t = g[ny][nx], a = A();
  if (t==="N") { talk(); return; }
  if (t==="M") { talkComp(); return; }
  if (BLOCK.has(t)) { say(t==="~" ? "過不去。" : "被擋住了。"); return; }
  if (t===">") {
    const nxt = AREAS[G.area+1];
    if (!G.cleared[G.area]) { say("🌀 傳送門被封印了,先擊敗守護者!"); return; }
    if (nxt && nxt.req && G.shards < nxt.req.shards) { say(`🌀 傳送門閃著微光,卻還缺少力量……需要 ⭐星之碎片 ${nxt.req.shards} 枚(目前 ${G.shards})。碎片藏在第 2~5 章的 🎁 裡。`); return; }
  }
  P.x = nx; P.y = ny; draw();
  if (t==="H") {
    P.hp = P.mhp; P.mp = P.mmp; hud(); save(); beep(660,.12,"triangle");
    say(`${THEMES[a.th].h} 好好休息了一下,HP / MP 全部回復!`);
  } else if (t==="S") openShop();
  else if (t==="$") openChest(nx, ny);
  else if (t==="*") openStar(nx, ny);
  else if (t===">") goArea(G.area+1, false);
  else if (t==="<") goArea(G.area-1, true);
  else if (t==="B") { say(`${a.boss.i} ${a.boss.n} 擋住了去路!`); startBattle([mk(a.boss)]); }
  else if (t==="." && Math.random() < a.rate) {
    if (Math.random() < .04) {
      const ai = G.area;
      startBattle([mk({ n:"黃金史萊姆", i:"🟡", hp:30+ai*25, atk:4+ai*3, xp:40+ai*35, g:60+ai*50, rare:true })]);
    } else startBattle(groupFor());
  } else if (t === "." && Math.random() < .035) randomEvent();
  else say("");
}
function goArea(i, back) {
  G.area = i; setTimeout(checkAch, 0);
  const a = AREAS[i];
  [P.x, P.y] = back ? a.gate.b : a.from;
  hud(); draw(); save(); jingle([523,659]);
  say(`🌀 你來到了「${a.name}」。${a.hidden && !back ? "<br>✨ 這裡是隱藏關卡,敵人非常強大!" : ""}`);
}
function mk(e, elite) {
  const d = DIFFS[G.diff];
  const f = { ...e, base:e.n };
  f.hp = f.mhp = Math.round(e.hp*d.hp); f.atk = Math.round(e.atk*d.atk);
  f.xp = Math.round(e.xp*d.r); f.g = Math.round(e.g*d.r);
  if (elite) { f.n = "精英" + e.n; f.hp = f.mhp = Math.round(f.hp*1.4); f.atk = Math.round(f.atk*1.3); f.xp *= 2; f.g *= 2; f.elite = true;
    const extra = ACTIVE.filter(x => !f.sk.includes(x)); f.sk = [...f.sk, extra[rnd(0, extra.length-1)]]; }
  return f;
}

// ---------- 寶箱 / 碎片 / NPC / 夥伴 ----------
function openChest(x, y) {
  const key = [G.area,x,y].join(",");
  if (G.opened[key]) return;
  G.opened[key] = 1; cur()[y][x] = ".";
  const r = Math.random(); let msg;
  if (r < .5)      { const g = rnd(15,30)*(G.area+1); P.gold += g; msg = `💰 ${g} 金幣`; }
  else if (r < .8) { const n = rnd(1,2); P.potion += n; msg = `🧪 藥水 x${n}`; }
  else if (r < .92){ P.ether++; msg = "🔹 魔力水 x1"; }
  else             { P.pts++; msg = "✨ 能力點 +1"; }
  hud(); save(); beep(880,.1,"triangle"); say(`📦 打開寶箱,獲得 ${msg}!`);
}
function openStar(x, y) {

  G.opened[key] = 1; cur()[y][x] = "."; G.shards++; P.pts++;

}
function rewardText(r) {

function talk() {
  const n = A().npc, s = G.q[G.area] || (G.q[G.area] = { i:0, st:0, c:0 });
  const q = n.quests[s.i];

  else body = `${n.wait}<br><br>📜 進度 ${s.c}/${q.n}`;
  openModal(`<h2>${n.i} ${n.n}</h2><div style="line-height:1.6">${body}</div><button style="margin-top:12px" onclick="closeModal()">好</button>`);

function talkComp() {

}

// ---------- 戰鬥 ----------
let foes = [], tgt = 0, hitList = [], dealt = 0;
function fx(el, cls) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
const living = () => foes.filter(f => f.hp > 0);
function pickTarget() {
  if (!foes[tgt] || foes[tgt].hp <= 0) tgt = Math.max(0, foes.findIndex(f => f.hp > 0));
  return (foe = foes[tgt]);
}
function selectTarget(i) { if (busy || !foes[i] || foes[i].hp <= 0) return; tgt = i; foe = foes[i]; renderFoes(); }
function renderFoes() {
  const box = $("foes"), n = foes.length;
  box.style.setProperty("--fs", n===1 ? "clamp(64px,16vw,110px)" : n===2 ? "clamp(52px,12vw,86px)" : "clamp(40px,9vw,66px)");
  box.innerHTML = foes.map((f,i) => `<div class="fo ${i===tgt && f.hp>0 ? "sel" : ""} ${f.hp<=0 ? "dead" : ""}" id="fo${i}" onclick="selectTarget(${i})">
    <span class="ic">${f.i}</span><small>${f.n}${f.summoned ? "(召喚)" : ""}${f.stun ? " 💫" : ""}${f.poison && f.poison.t>0 ? " ☠️" : ""}${f.guard ? " 🛡️" : ""}${f.shield>0 ? " 🔰" : ""}</small><small style="opacity:.85" title="${(f.sk||[]).map(id => ESKILL[id].n+":"+ESKILL[id].t).join(" / ")}">${(f.sk||[]).map(id => ESKILL[id].i).join("")}</small>
    <div class="bar" style="width:90px;margin:4px auto 0;height:8px"><i style="width:${Math.max(0,f.hp/f.mhp*100)}%;background:var(--hp)"></i></div></div>`).join("");
}
function groupFor() {
  const ai = G.area, r = Math.random();
  const p3 = Math.min(.25, ai*.05), p2 = Math.min(.4, .25 + ai*.03);
  const n = r < p3 ? 3 : r < p3+p2 ? 2 : 1;
  return Array.from({ length:n }, () => mk(A().e[rnd(0, A().e.length-1)], Math.random() < .06));
}
function startBattle(list) {
  foes = list; foes.forEach(f => f.turn = 0); tgt = 0; foe = foes[0];
  inBattle = true; busy = false; P.poison = null; P.dodge = 0; P.stunned = 0; P.weak = null; P.revived = false;
  $("battle").style.display = "flex";

  const names = {}; foes.forEach(f => names[f.n] = (names[f.n]||0) + 1);

  $("blog").innerHTML = `${foes.some(f => f.elite) ? "⚠️ " : ""}${Object.entries(names).map(([n,c]) => c>1 ? n+" x"+c : n).join("、")} 出現了!${known.length ? "<br><small>敵人技能:"+known.map(id => ESKILL[id].i+ESKILL[id].n).join(" ")+"</small>" : ""}${foes.length>1 ? "<br><small>點選敵人可指定目標;標有「全體」的技能會打到所有敵人。</small>" : ""}`;

}
function renderCmds() {
  const c = $("cmds"); c.innerHTML = "";
  const add = (label, fn, id) => { const b = document.createElement("button"); b.textContent = label; b.onclick = fn; b.id = id||""; c.appendChild(b); };
  add("⚔️ 攻擊", () => playerAct("atk"), "bAtk");
  CL().sk.filter(k => P.lv >= k.lv).forEach(k => add(`${k.n}${k.aoe ? " 全體" : k.spread ? " 亂射" : ""} (${k.mp})`, () => playerAct(k.id), "sk_"+k.id));
  add(`🧪 藥水 x${P.potion}`, () => playerAct("potion"), "bPot");
  add(`🔹 魔力水 x${P.ether}`, () => playerAct("ether"), "bEth");
  add("🏃 逃跑", () => playerAct("run"), "bRun");
}
function refreshBattle() {
  renderFoes(); renderCmds();
  document.querySelectorAll("#cmds button").forEach(b => b.disabled = busy);
  CL().sk.forEach(k => { const b = $("sk_"+k.id); if (b && P.mp < k.mp) b.disabled = true; });
  if (P.potion <= 0) $("bPot").disabled = true;
  if (P.ether <= 0) $("bEth").disabled = true;
  hud();
}
function blog(t) { $("blog").innerHTML += "<br>" + t; }

function castSkill(k) {
  const cl = CL(), a = tAtk(); let tot = 0;
  const by = new Map();
  const strike = (t, m, add, force) => {
    let d = Math.round(a*m*(cl.sp + eqf("sp"))) + (add ? rnd(add[0], add[1]) : 0);
    const c = force || Math.random() < critRate(); if (c) d = Math.round(d*1.8);
    d = hurt(t, d); tot += d; hitList.push(foes.indexOf(t));
    const e = by.get(t) || { d:0, c:false }; e.d += d; e.c = e.c || c; by.set(t, e);
  };
  if (k.m) {
    if (k.aoe) living().forEach(t => strike(t, k.m, k.add, k.crit));
    else if (k.spread) for (let i=0;i<(k.hits||1);i++) { const L = living(); if (L.length) strike(L[rnd(0, L.length-1)], k.m, k.add, k.crit); }
    else { pickTarget(); for (let i=0;i<(k.hits||1);i++) strike(foe, k.m, k.add, k.crit); }
    blog(`${k.n}!${[...by].map(([t,e]) => `${t.n} ${e.d}${e.c ? "!" : ""}`).join("、")}`);
    beep(260,.1,"sawtooth");
  }
  dealt = tot;
  if (k.drain) { const h = Math.ceil(tot/2); P.hp = Math.min(P.mhp, P.hp+h); blog(`回復 ${h} HP。`); }
  by.forEach((e, t) => {
    if (k.stun && !t.boss && t.hp > 0 && Math.random() < k.stun) { t.stun = 1; blog(`💫 ${t.n} 無法行動!`); }
    if (k.poison && t.hp > 0) { t.poison = { d:k.poison.d + Math.floor(P.lv/2), t:k.poison.t }; blog(`☠️ ${t.n} 中毒了。`); }
  });
  if (k.heal) { const h = k.heal.f ? Math.round(P.mhp*k.heal.f) : 15 + P.lv*2; P.hp = Math.min(P.mhp, P.hp+h); blog(`💚 恢復了 ${h} HP。`); beep(660,.12,"triangle"); }
  if (k.dodge) { P.dodge = k.dodge; blog(`🌫️ 你化作殘影,將閃避接下來 ${k.dodge} 次攻擊。`); }
}
function companionTurn() {
  P.party.forEach(id => {
    if (!living().length) return;
    const lv = compLv(id);
    if (id === "wolf") {
      for (let i=0;i<(lv >= 10 ? 2 : 1);i++) {
        const L = living(); if (!L.length) break;
        const first = i === 0 ? null : foes[tgt], others = L.filter(x => x !== first);
        const t = i === 0 ? pickTarget() : (others.length ? others : L)[rnd(0, (others.length ? others : L).length-1)];
        let d = Math.round(tAtk()*(.4 + .025*lv)) + rnd(0, 2 + Math.floor(lv/3)); if (lv >= 15) d = Math.round(d*1.25);
        d = hurt(t, d); hitList.push(foes.indexOf(t)); blog(`🐺 白狼撲咬 ${t.n},造成 ${d} 傷害。`);
        if (lv >= 5 && t.hp > 0) t.poison = { d:2 + Math.floor(lv/2), t:3 };
      }
    } else if (id === "fairy") {
      const h = 4 + lv*2 + Math.round(P.lv*.5); P.hp = Math.min(P.mhp, P.hp+h); let m = `🧚 妖精為你療傷,回復 ${h} HP`;
      if (lv >= 5 && P.poison && P.poison.t > 0) { P.poison = null; m += ",並解除了異常狀態"; }
      if (lv >= 10) { const mp = 2 + Math.floor(lv/5); P.mp = Math.min(P.mmp, P.mp+mp); m += `,回復 ${mp} MP`; }
      blog(m + "。");
    }
  });
}
// 狂暴 / 頭目倒下時召喚物消散
function settle() {

  const rows = merch.deals.map((d,i) => {
    if (d.item) { const it = d.item;
      return `<div class="icard" style="margin-top:6px"><div class="ihead"><span class="iname" style="color:${RARITY[it.rar].c}">${itemIcon(it)} ${it.n}</span><span class="lvb">Lv ${itemLv(it)}</span></div>
        <div class="chips">${statChips(it)}</div>${cmpChips(it) ? `<div class="cmp">較目前 ${cmpChips(it)}</div>` : ""}
        <div class="iact"><button onclick="buyDeal(${i})" ${d.sold || P.gold<d.price ? "disabled" : ""}>${d.sold ? "已售出" : "💰 "+d.price}</button></div></div>`; }
    return `<div class="row"><span>${d.txt}</span><button onclick="buyDeal(${i})" ${d.sold || P.gold<d.price ? "disabled" : ""}>${d.sold ? "已售出" : "💰 "+d.price}</button></div>`;
  }).join("");
  openModal(`<h2>🧙 神秘商人 · 💰 ${P.gold}</h2><div style="opacity:.8;margin-bottom:6px">「嘿嘿,只有今天,離開了就沒有囉。」</div>${rows}
    <button style="margin-top:12px" onclick="closeModal()">離開</button>`);
}
function buyDeal(i) {
  const d = merch.deals[i]; if (d.sold || P.gold < d.price) return;
  if (d.item && bagCount() >= 40) return say("背包已滿(40 件),先整理一下吧。");
  P.gold -= d.price; d.sold = true;
  if (d.item) P.owned.push(d.item.id); else d.give();
  hud(); save(); beep(520,.08,"triangle"); renderMerchant();
}
function openGambler(msg) {
  const k = G.area + 1, bets = [30*k, 100*k, 300*k];
  openModal(`<h2>🎲 流浪賭徒 · 💰 ${P.gold}</h2>
    <div style="opacity:.8;margin-bottom:8px">「猜大小,贏了賠雙倍,輸了就沒收——敢不敢賭一把?」</div>
    ${msg ? `<div class="row"><b>${msg}</b></div>` : ""}
    <div class="seg">${bets.map(b => `<button onclick="gamble(${b})" ${P.gold<b ? "disabled" : ""}>賭 💰${b}</button>`).join("")}</div>
    <button style="margin-top:10px" onclick="closeModal()">離開</button>`);
}
function gamble(b) {
  if (P.gold < b) return;
  let msg;
  if (Math.random() < .46) { P.gold += b; msg = `🎉 你贏了!+${b} 金幣`; beep(880,.12,"triangle"); }
  else { P.gold -= b; msg = `💸 你輸了……-${b} 金幣`; beep(160,.15,"sawtooth"); }
  hud(); save(); openGambler(msg);
}

// ---------- 試煉之塔 ----------
let tw = null;   // { floor, won }
const towerPool = n => Math.min(7, Math.floor((n-1)/6));
function towerFoes(n) {
  const ai = towerPool(n), pool = AREAS[ai].e, s = n > 48 ? 1 + (n-48)*.07 : 1;
  const scale = f => { f.tower = true; f.tier = ai; f.hp = f.mhp = Math.round(f.hp*s); f.atk = Math.round(f.atk*s);
    f.xp = Math.round(f.xp*(1 + n*.02)); f.g = Math.round(f.g*(1 + n*.02)); return f; };
  if (n % 10 === 0) { const b = scale(mk(AREAS[ai].boss)); b.n = "塔・" + b.n; return [b]; }
  const cnt = rnd(1, Math.min(3, 1 + Math.floor(n/10)));
  return Array.from({ length:cnt }, () => scale(mk(pool[rnd(0, pool.length-1)], Math.random() < .08)));
}
function openTower() {
  if (inBattle) return;
  const best = G.tower.best, cps = Array.from({ length:Math.floor(best/5) + 1 }, (_, k) => k*5 + 1);
  openModal(`<h2>🗼 試煉之塔</h2>
    <div style="line-height:1.6;opacity:.9">一層接一層的連戰,沒有盡頭。越往上敵人越強,每 10 層有一位頭目。<br>
    · 每層通關給 🔩素材,有機會掉裝備(越高層品階越高)<br>· 每 5 層是安全層,HP / MP 全部回復<br>· 每 10 層通關有稀有以上裝備與 ✨能力點<br>· 倒下不會損失金幣,只是挑戰結束</div>
    <div class="row"><span>🏅 最高紀錄</span><b>第 ${best} 層</b></div>
    <div style="opacity:.8;margin:8px 0 4px">選擇起點:</div>
    <div class="seg" style="flex-wrap:wrap">${cps.slice(-8).map(f => `<button onclick="startTower(${f})">第 ${f} 層${f>1 ? "<br><small>建議 Lv "+LV_REQ[towerPool(f)]+"+</small>" : ""}</button>`).join("")}</div>
    <button style="margin-top:12px" onclick="closeModal()">離開</button>`);
}
function startTower(f) { closeModal(); tw = { floor:f, won:false }; startTowerFloor(); }
function startTowerFloor() {
  startBattle(towerFoes(tw.floor));
  $("blog").innerHTML = `🗼 <b>第 ${tw.floor} 層</b><br>` + $("blog").innerHTML; hud();
}
function towerAfter(msg) {
  if (!tw.won) { tw = null; hud(); return; }   // 逃跑 = 離開
  tw.won = false;
  const n = tw.floor, ai = towerPool(n);
  G.tower.best = Math.max(G.tower.best, n);
  const ore = 1 + Math.floor(n/5); P.ore += ore;
  let extra = `<br>🗼 第 ${n} 層通關!🔩素材 +${ore}`;
  if (n % 10 === 0) { extra += dropItem(rollItem(ai + 1, false, true)); P.pts += 1; extra += "<br>✨ 頭目層里程碑:能力點 +1"; }
  if (n % 5 === 0) { P.hp = P.mhp; P.mp = P.mmp; extra += "<br>💚 安全層:HP / MP 全部回復!"; }
  else { P.hp = Math.min(P.mhp, P.hp + Math.round(P.mhp*.1)); P.mp = Math.min(P.mmp, P.mp + Math.round(P.mmp*.1)); extra += "<br>(休息片刻,回復 10% HP / MP)"; }
  hud(); save(); checkAch();
  openModal(`<h2>🗼 第 ${n} 層 通過!</h2><div style="line-height:1.55">${msg}${extra}</div>
    <div style="display:flex;gap:8px;margin-top:12px"><button style="flex:1" onclick="towerNext()">挑戰第 ${n+1} 層</button><button onclick="towerLeave()">離開試煉之塔</button></div>`);
}
function towerNext() { tw.floor++; closeModal(); startTowerFloor(); }
function towerLeave() { tw = null; closeModal(); hud(); say(`你離開了試煉之塔。最高紀錄:第 ${G.tower.best} 層。`); }
const towerModalOpen = () => tw && !foes.length && $("modal").style.display === "flex";

// ---------- 輸入 ----------
const KEYS = { ArrowUp:[0,-1], w:[0,-1], ArrowDown:[0,1], s:[0,1], ArrowLeft:[-1,0], a:[-1,0], ArrowRight:[1,0], d:[1,0] };
addEventListener("keydown", e => {
  if (!P.cls || towerModalOpen()) return;
  if (e.key==="p"||e.key==="P") return usePotion();
  if (e.key==="e"||e.key==="E") return useEther();
  if ((e.key==="i"||e.key==="I") && ($("modal").style.display==="flex" || !inBattle)) return $("modal").style.display==="flex" ? closeModal() : openEquip();
  if ((e.key==="b"||e.key==="B") && ($("modal").style.display==="flex" || !inBattle)) return $("modal").style.display==="flex" ? closeModal() : openCodex();
  if ((e.key==="v"||e.key==="V") && ($("modal").style.display==="flex" || !inBattle)) return $("modal").style.display==="flex" ? closeModal() : openAch();
  if ((e.key==="t"||e.key==="T") && !inBattle) return openTower();
  if (e.key==="Escape" && $("modal").style.display==="flex" && !foes.length) return closeModal();
  if (e.key==="c"||e.key==="C") return $("modal").style.display==="flex" ? closeModal() : openStats();
  const d = KEYS[e.key] || KEYS[e.key.toLowerCase?.()];
  if (d) { e.preventDefault(); move(...d); }
});
document.querySelectorAll("#pad button").forEach(b =>
  b.addEventListener("click", () => { if (P.cls) move(...b.dataset.d.split(",").map(Number)); }));

// ---------- 開始 ----------
if (load()) {
  hud(); draw(); say("📂 已讀取上次的進度,繼續冒險!");
} else {
  [P.x, P.y] = AREAS[0].from;
  hud(); draw(); openTitle(1);
}
</script>
</body>
</html>
