<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>勇者物語 RPG</title>
<style>
  :root { --bg:#12141c; --panel:#1d2130; --line:#3a4160; --text:#e8ecff; --hp:#e5484d; --mp:#4b8bff; --xp:#f5c542; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,"Noto Sans TC",sans-serif;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:12px; user-select:none; }
  h1 { font-size:18px; margin:4px 0 8px; letter-spacing:2px; }
  #wrap { position:relative; width:min(96vw,480px); }
  canvas { width:100%; display:block; background:#000; border:2px solid var(--line); border-radius:8px; image-rendering:pixelated; }
  #hud { display:flex; gap:10px; font-size:13px; margin:8px 0; width:min(96vw,480px); justify-content:space-between;
         background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; }
  .bar { height:6px; background:#0008; border-radius:3px; overflow:hidden; margin-top:3px; }
  .bar i { display:block; height:100%; }
  #log { width:min(96vw,480px); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px;
         min-height:64px; font-size:14px; line-height:1.5; }
  #battle { position:absolute; inset:0; background:#0b0d14f2; border-radius:8px; display:none; flex-direction:column;
            justify-content:space-between; padding:14px; }
  #battle .foe { text-align:center; font-size:64px; margin-top:10px; }
  #battle .foe small { display:block; font-size:14px; }
  #cmds { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px;
           font-size:15px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:#8fa0ff; }
  button:disabled { opacity:.4; cursor:default; }
  #pad { display:none; grid-template-columns:repeat(3,56px); gap:6px; margin-top:10px; }
  @media (pointer:coarse) { #pad { display:grid; } }
  #pad button { height:56px; padding:0; font-size:20px; }
  .tip { font-size:12px; opacity:.6; margin-top:8px; }
</style>
</head>
<body>
<h1>⚔️ 勇者物語</h1>
<div id="hud"></div>
<div id="wrap">
  <canvas id="c" width="480" height="480"></canvas>
  <div id="battle">
    <div class="foe"><span id="foeIcon"></span><small id="foeName"></small>
      <div class="bar" style="width:60%;margin:6px auto 0;height:8px"><i id="foeHp" style="background:var(--hp)"></i></div></div>
    <div>
      <div id="blog" style="min-height:70px;font-size:14px;line-height:1.5;margin-bottom:8px"></div>
      <div id="cmds">
        <button id="bAtk">⚔️ 攻擊</button>
        <button id="bSkl">🔥 火球 (MP 4)</button>
        <button id="bHeal">💚 治療 (MP 5)</button>
        <button id="bRun">🏃 逃跑</button>
      </div>
    </div>
  </div>
</div>
<div id="log"></div>
<div id="pad">
  <span></span><button data-d="0,-1">▲</button><span></span>
  <button data-d="-1,0">◀</button><button data-d="0,1">▼</button><button data-d="1,0">▶</button>
</div>
<div class="tip">方向鍵 / WASD 移動 · 🌿草地會遇敵 · 🏠村莊可回復 · 擊敗 💀 魔王通關</div>

<script>
// ---------- 地圖 ----------
// . 草地  # 牆/樹  ~ 水  H 村莊(回復)  C 魔王城  F 森林  : 路
const MAP = [
"####################",
"#..................#",
"#.FFF....~~~.......#",
"#.FFF....~~~...FF..#",
"#.FF.....~~~...FF..#",
"#........~~~.......#",
"#...H....:::.......#",
"#........:.~~~.....#",
"#..FF....:.~~~..FF.#",
"#..FF....:.~~~..FF.#",
"#........:.........#",
"#.....FF.:...FF....#",
"#.....FF.:...FF....#",
"#........:.........#",
"#..~~~...:.....H...#",
"#..~~~...:.........#",
"#........:::::.....#",
"#..FF..........FF..#",
"#..FF....C.....FF..#",
"####################"
].map(r => r.split(""));
const T = 24, N = 20;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;
const ICON = { ".":["#3e8e41","🌿"], "#":["#1f2a20","🌲"], "~":["#2f6fd6","〰️"], "H":["#3e8e41","🏠"],
               "C":["#3a2a4a","🏰"], "F":["#2b6a33","🌳"], ":":["#a88c5c",""] };
const BLOCK = new Set(["#","~","F"]);

// ---------- 狀態 ----------
const P = { x:4, y:7, hp:30, mhp:30, mp:10, mmp:10, atk:6, lv:1, xp:0, next:20, gold:0, potion:2 };
let inBattle = false, foe = null, over = false, busy = false;
const ENEMIES = [
  { n:"史萊姆", i:"🟢", hp:12, atk:3, xp:6,  g:4 },
  { n:"哥布林", i:"👺", hp:20, atk:5, xp:10, g:8 },
  { n:"蝙蝠",   i:"🦇", hp:16, atk:6, xp:12, g:7 },
  { n:"骷髏兵", i:"💀", hp:32, atk:8, xp:20, g:14 },
];
const BOSS = { n:"魔王", i:"👹", hp:120, atk:14, xp:0, g:0, boss:true };

const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function say(t) { $("log").innerHTML = t; }

function hud() {
  const bar = (v,m,c) => `<div class="bar"><i style="width:${v/m*100}%;background:${c}"></i></div>`;
  $("hud").innerHTML =
    `<div>Lv ${P.lv}${bar(P.xp,P.next,"var(--xp)")}</div>` +
    `<div>❤️ ${P.hp}/${P.mhp}${bar(P.hp,P.mhp,"var(--hp)")}</div>` +
    `<div>🔷 ${P.mp}/${P.mmp}${bar(P.mp,P.mmp,"var(--mp)")}</div>` +
    `<div>💰 ${P.gold}<br>🧪 ${P.potion}</div>`;
}

// ---------- 繪製 ----------
function draw() {
  ctx.clearRect(0,0,480,480);
  ctx.font = "20px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let y=0;y<N;y++) for (let x=0;x<N;x++) {
    const [bg,ic] = ICON[MAP[y][x]];
    ctx.fillStyle = bg; ctx.fillRect(x*T,y*T,T,T);
    if (ic && MAP[y][x] !== ".") ctx.fillText(ic, x*T+T/2, y*T+T/2+1);
    else if (MAP[y][x]==="." && (x*7+y*13)%9===0) { ctx.globalAlpha=.5; ctx.fillText("🌱",x*T+T/2,y*T+T/2); ctx.globalAlpha=1; }
  }
  ctx.font = "22px serif";
  ctx.fillText("🧙", P.x*T+T/2, P.y*T+T/2+1);
}

// ---------- 移動 ----------
function move(dx,dy) {
  if (inBattle || over) return;
  const nx = P.x+dx, ny = P.y+dy;
  if (nx<0||ny<0||nx>=N||ny>=N) return;
  const t = MAP[ny][nx];
  if (BLOCK.has(t)) { say(t==="~" ? "水太深了,過不去。" : "被擋住了。"); return; }
  P.x = nx; P.y = ny; draw();
  if (t==="H") {
    P.hp = P.mhp; P.mp = P.mmp; hud();
    say("🏠 村民熱情招待,HP / MP 全部回復!");
  } else if (t==="C") {
    say("🏰 魔王城!魔王現身了!"); startBattle({...BOSS});
  } else if (t==="." && Math.random() < 0.14) {
    startBattle({...ENEMIES[Math.min(rnd(0, 1 + Math.floor(P.lv/2)), ENEMIES.length-1)]});
  } else say("");
}

// ---------- 戰鬥 ----------
function startBattle(e) {
  foe = {...e, mhp:e.hp}; inBattle = true; busy = false;
  $("battle").style.display = "flex";
  $("foeIcon").textContent = foe.i; $("foeName").textContent = foe.n;
  $("blog").innerHTML = `${foe.n} 出現了!`;
  refreshBattle();
}
function refreshBattle() {
  $("foeHp").style.width = Math.max(0, foe.hp/foe.mhp*100) + "%";
  $("bSkl").disabled = busy || P.mp < 4;
  $("bHeal").disabled = busy || P.mp < 5;
  $("bAtk").disabled = $("bRun").disabled = busy;
  hud();
}
function blog(t) { $("blog").innerHTML += "<br>" + t; }

function playerAct(kind) {
  if (busy) return;
  busy = true; $("blog").innerHTML = "";
  if (kind==="atk") {
    const d = rnd(P.atk-1, P.atk+3); foe.hp -= d; blog(`你攻擊 ${foe.n},造成 ${d} 傷害!`);
  } else if (kind==="skl") {
    P.mp -= 4; const d = rnd(P.atk+4, P.atk+9); foe.hp -= d; blog(`🔥 火球術!造成 ${d} 傷害!`);
  } else if (kind==="heal") {
    P.mp -= 5; const h = 15 + P.lv*2; P.hp = Math.min(P.mhp, P.hp+h); blog(`💚 恢復了 ${h} HP。`);
  } else if (kind==="run") {
    if (foe.boss) blog("魔王不讓你逃跑!");
    else if (Math.random() < 0.6) { endBattle("你成功逃跑了。"); return; }
    else blog("逃跑失敗!");
  }
  refreshBattle();
  if (foe.hp <= 0) return win();
  setTimeout(foeTurn, 600);
}
function foeTurn() {
  const d = Math.max(1, rnd(foe.atk-2, foe.atk+2));
  P.hp -= d; blog(`${foe.n} 攻擊你,受到 ${d} 傷害!`);
  if (P.hp <= 0) { P.hp = 0; refreshBattle(); return lose(); }
  busy = false; refreshBattle();
}
function win() {
  if (foe.boss) { over = true; endBattle(""); say("🎉 魔王被擊敗了!世界恢復和平,你通關了!<br><button onclick='location.reload()'>再玩一次</button>"); return; }
  P.xp += foe.xp; P.gold += foe.g;
  let msg = `擊敗 ${foe.n}!獲得 ${foe.xp} 經驗、${foe.g} 金幣。`;
  if (Math.random() < 0.2) { P.potion++; msg += " 撿到一瓶🧪藥水!"; }
  while (P.xp >= P.next) {
    P.xp -= P.next; P.lv++; P.next = Math.round(P.next*1.5);
    P.mhp += 8; P.mmp += 3; P.atk += 2; P.hp = P.mhp; P.mp = P.mmp;
    msg += `<br>⭐ 升級!現在 Lv ${P.lv}。`;
  }
  endBattle(msg);
}
function lose() {
  over = true; $("battle").style.display = "none"; inBattle = false;
  say("💀 你倒下了……<br><button onclick='location.reload()'>重新開始</button>");
}
function endBattle(msg) {
  inBattle = false; $("battle").style.display = "none"; hud(); draw(); if (msg) say(msg);
}

$("bAtk").onclick = () => playerAct("atk");
$("bSkl").onclick = () => playerAct("skl");
$("bHeal").onclick = () => playerAct("heal");
$("bRun").onclick = () => playerAct("run");

// 戰鬥外使用藥水:按 P
function usePotion() {
  if (inBattle || over) return;
  if (P.potion<=0) return say("沒有藥水了。");
  if (P.hp>=P.mhp) return say("HP 已經是滿的。");
  P.potion--; P.hp = Math.min(P.mhp, P.hp+20); hud(); say("🧪 使用藥水,回復 20 HP。");
}

// ---------- 輸入 ----------
const KEYS = { ArrowUp:[0,-1], w:[0,-1], ArrowDown:[0,1], s:[0,1], ArrowLeft:[-1,0], a:[-1,0], ArrowRight:[1,0], d:[1,0] };
addEventListener("keydown", e => {
  if (e.key==="p"||e.key==="P") return usePotion();
  const d = KEYS[e.key] || KEYS[e.key.toLowerCase?.()];
  if (d) { e.preventDefault(); move(...d); }
});
document.querySelectorAll("#pad button").forEach(b =>
  b.addEventListener("click", () => move(...b.dataset.d.split(",").map(Number))));

hud(); draw();
say("你是年輕的勇者。往南走,穿過道路,擊敗城堡裡的魔王吧!(按 P 使用藥水)");
</script>
</body>
</html>
